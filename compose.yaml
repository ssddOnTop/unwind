services:
  monolith:
    build: .
    image: unwind-monolith:local
    env_file: .env
    environment:
      COMPANION_DAILY_SYNTHESIS_MODE: ${COMPANION_DAILY_SYNTHESIS_MODE:-disabled}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${COMPANION_DATA_DIR:?Set COMPANION_DATA_DIR to the prepared private PostgreSQL residual root}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${SUPABASE_CA_FILE:?Set SUPABASE_CA_FILE to the host CA certificate path}
        target: /run/certs/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
