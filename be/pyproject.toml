[project]
name = "local-companion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic==2.12.5",
  "jsonschema[format]>=4.23,<5", "deepagents==0.7.38", "langgraph==1.2.22",
  "langchain==1.5.0", "langchain-openai==1.8.0",
  "langgraph-checkpoint-sqlite==3.1.3", "aiosqlite==0.22.1",
  "httpx==0.28.1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = "--basetemp=.pytest-tmp"
asyncio_default_fixture_loop_scope = "function"
